name: Bug report
description: Report a reproducible problem in the CLI, installer, or platform adapters.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make reviews more reliable. Remove secrets and proprietary code from all examples.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options: [Codex plugin, Claude Code plugin, CLI, Installer, Benchmark, Documentation site]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, scope, and sanitized Git state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Auto Code Review, host agent, Node.js, Git, and operating system.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, and proprietary source code.
          required: true
