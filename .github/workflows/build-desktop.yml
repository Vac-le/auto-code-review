name: Build Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build CLI package
        run: |
          cd packages/cli
          npm run build

      - name: Build Desktop installer
        run: |
          cd packages/desktop
          npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packages/desktop/release/*.exe
          retention-days: 30

      - name: Upload blockmap
        uses: actions/upload-artifact@v4
        with:
          name: windows-blockmap
          path: packages/desktop/release/*.blockmap
          retention-days: 30
