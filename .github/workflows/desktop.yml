name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run dist:win --workspace @auto-code-review/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: auto-code-review-windows-x64
          path: packages/desktop/release/Auto-Code-Review-*-x64.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem packages/desktop/release/Auto-Code-Review-*-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --verify-tag --generate-notes --title "Auto Code Review $env:GITHUB_REF_NAME"
